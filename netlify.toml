# netlify.toml - Updated for VIEREN preview functionality

[dev]
  command = "yarn develop"
  functions = "static/functions"
  targetPort = 8000

[build]
  functions = "static/functions"
  command = "yarn build"

[build.environment]
  NODE_OPTIONS = "--max_old_space_size=4096"
  GATSBY_CPU_COUNT = "2"
  GATSBY_CONCURRENT_DOWNLOAD = "5"

[[plugins]]
  package = "@netlify/plugin-gatsby"

# Headers for preview functionality and CORS
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Access-Control-Allow-Origin = "https://vieren-cms-prod.zuratech.ca"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

# Preview-specific headers
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = '''
    public,
    max-age=0,
    must-revalidate'''
  [headers.query]
    preview = "true"

# Redirect rules for WordPress admin access
[[redirects]]
  from = "/wp-admin/*"
  to = "https://vieren-cms-prod.zuratech.ca/wp-admin/:splat"
  status = 302
  force = false

[[redirects]]
  from = "/wp-login.php"
  to = "https://vieren-cms-prod.zuratech.ca/wp-login.php"
  status = 302

# Preview page routing
[[redirects]]
  from = "/*/preview"
  to = "/preview/:splat"
  status = 200

# Catch-all for client-side routing with preview parameters
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Query = {preview = "true"}}


[context.deploy-preview]
  [context.deploy-preview.environment]
    GATSBY_PREVIEW_MODE = "true"
    GATSBY_SITE_URL = "https://devserver-master--vieren-test.netlify.app"

[context.branch-deploy]
  [context.branch-deploy.environment]
    GATSBY_PREVIEW_MODE = "true"
    GATSBY_SITE_URL = "https://devserver-master--vieren-test.netlify.app"